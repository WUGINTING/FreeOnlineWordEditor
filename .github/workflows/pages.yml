# Publishes the demo site (index.html, playground.html) to GitHub Pages.
# Once, in the repository: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      # The page with one <script>, next to the standalone file it loads.
      - run: |
          mkdir -p dist-demo/examples dist-demo/dist
          cp examples/script-tag.html dist-demo/examples/
          cp dist/papyrus-docx.standalone.iife.js dist-demo/dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
